name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Core checks
        run: swift run IslandChecks
      - name: Account isolation checks
        run: bash scripts/check-account-isolation.sh
